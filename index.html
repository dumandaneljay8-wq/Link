<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  
  <style>
#hearts {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.heart {
  position: absolute;
  bottom: -30px;
  font-size: 25px;
  animation: floatUp 5s linear forwards;
}

@keyframes floatUp {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}
  </style>
  
</head>
  
<body style="text-align:center; padding-top:100px;">

  <div id="hearts"></div>
  
  <h2>May sasabihin ako...</h2>
  
<p>Type "I love you" to continue ❤️</p>

<input id="answer" type="text" placeholder="Type here...">

<button onclick="checkAnswer()">Continue 💗</button>

<p id="wrong" style="display:none;">Try again 😆</p>
  
  <div id="opens" style="display:none;">

<button onclick="document.getElementById('msg1').style.display='block'">
  Open 1 💗
</button>

  <h1 id="msg1" style="display:none;">
    I love you ❤️ Sorry pudd
  </h1>
  
<button onclick="document.getElementById('msg2').style.display='block'">
    Open 2 💗
</button>
    
  </div>
  
  <h1 id="msg2" style="display:none;">
  Goodluck sa atong futureee atimana imong kaugalingon I LOVEE YOUU!!!
  </h1>

<button onclick="document.getElementById('msg1').style.display='none'">
  Close 1 💗
</button>

<button onclick="document.getElementById('msg2').style.display='none'">
  Close 2 💗
  
</button>
<script>
function checkAnswer() {
  let answer = document.getElementById("answer").value.toLowerCase().trim();

  if (answer === "i love you") {
    document.getElementById("opens").style.display = "block";
    document.getElementById("wrong").style.display = "none";
  } else {
    document.getElementById("wrong").style.display = "block";
  }
}
                            </script>
  <script>
setInterval(function() {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 25) + "px";

  document.getElementById("hearts").appendChild(heart);

  setTimeout(function() {
    heart.remove();
  }, 5000);
}, 500);
  </script>
  
  </body>
</html>
